<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Reach - Product</title>
    <meta name="description" content="Explore Route Reach's product features and see how we compare.">
    <link rel="stylesheet" href="styles.css">

<body>
  <nav>
        <img class="logo" src="Routereachlogo.png" alt="Route Reach logo">
        <ul>

            <li><a href="product.html">Product</a></li>
            <li><a href="plan-trip.html">Plan a Trip</a></li>
        </ul>

     <div class="section section-1">
    <div class="black-box">
      <div class="ui-picture">UI Picture</div>

    <div class="feature-info">
